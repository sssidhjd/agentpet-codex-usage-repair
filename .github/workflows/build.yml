name: Build AgentPet Codex usage repair

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agentpet-codex-repair
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repair overlay
        uses: actions/checkout@v4
        with:
          path: repair
          persist-credentials: false
      - name: Check out exact official Windows 0.1.8 source
        uses: actions/checkout@v4
        with:
          repository: ntd4996/agentpet
          ref: 78633a1e62e349bf55c9232a25475a5308476e6a
          path: upstream
          persist-credentials: false
      - name: Apply the reviewed source overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('src/care.ts', 'src/main.ts', 'src/popover.ts', 'src-tauri/src/lib.rs', 'src-tauri/src/server.rs', 'src-tauri/src/codex_usage.rs', 'scripts/codex-usage.test.mjs')
          foreach ($file in $files) {
            Copy-Item -LiteralPath "repair/windows/$file" -Destination "upstream/windows/$file" -Force
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Rust on the cloud runner only
        uses: dtolnay/rust-toolchain@stable
      - name: Install locked frontend dependencies
        working-directory: upstream/windows
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test persisted receipts and migration
        working-directory: upstream/windows
        run: node --test scripts/codex-usage.test.mjs
      - name: Type-check and build frontend
        working-directory: upstream/windows
        run: npm run build
      - name: Run native parser and resolver regression tests
        working-directory: upstream/windows/src-tauri
        run: cargo test --release --locked codex_usage::tests
      - name: Build portable application
        working-directory: upstream/windows
        run: npm run tauri -- build --no-bundle
      - name: Record artifact identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item -LiteralPath 'upstream/windows/src-tauri/target/release/agentpet.exe' -Destination 'artifact/agentpet.exe'
          Copy-Item -LiteralPath 'repair/LICENSE' -Destination 'artifact/LICENSE'
          Copy-Item -LiteralPath 'repair/README.md' -Destination 'artifact/README.md'
          $hash = (Get-FileHash -LiteralPath 'artifact/agentpet.exe' -Algorithm SHA256).Hash
          [ordered]@{repairCommit=$env:GITHUB_SHA;upstreamCommit='78633a1e62e349bf55c9232a25475a5308476e6a';sha256=$hash;officialRelease=$false;automaticUpdates=$false;tests='frontend and Rust regression tests passed'} | ConvertTo-Json | Set-Content -LiteralPath 'artifact/build-manifest.json' -Encoding utf8
      - name: Upload tested portable executable
        uses: actions/upload-artifact@v4
        with:
          name: agentpet-codex-usage-repair
          path: artifact/
          if-no-files-found: error
          retention-days: 14
